name: guardrails

# SPEC-009 R1: the job checks out the base commit and runs the base's guardrails/check.py, so a pull request
# cannot weaken the script that judges it. The head is fetched as git objects and read, never checked out,
# installed or executed. Running on pull_request means this workflow file is the head's (SPEC-009 D5).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the head as objects only
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --no-recurse-submodules origin "$HEAD_SHA"
      - name: SPEC-009 layer 2 and 3 rules
        run: |
          # Bootstrap only (SPEC-009 R1): the first pull request that adds guardrails/ has no base copy to run.
          if [ ! -f guardrails/check.py ]; then echo "::notice::base has no guardrails/check.py yet"; exit 0; fi
          python3 -I guardrails/check.py guardrails --repo . --event "$GITHUB_EVENT_PATH"

  # SPEC-009 R41: a separate job so the ruleset can require it or not (non-required during the waiver).
  foundation-24h:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the head as objects only
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --no-recurse-submodules origin "$HEAD_SHA"
      - name: SPEC-009 R40 (24 h since the last commit on a foundation change)
        run: |
          if [ ! -f guardrails/check.py ]; then echo "::notice::base has no guardrails/check.py yet"; exit 0; fi
          python3 -I guardrails/check.py foundation-24h --repo . --event "$GITHUB_EVENT_PATH" --now "$(date -u +%s)"
