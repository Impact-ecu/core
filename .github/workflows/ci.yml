name: core-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Both architectures run the fixed-hash SPEC-001 vectors: SPEC-000 invariant 1 (determinism).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.2"
          enable-cache: false
      - name: Install (locked)
        run: uv sync --locked --python python3.12
      - name: ruff check
        run: uv run --locked ruff check src tests
      - name: ruff format
        run: uv run --locked ruff format --check src tests
      - name: mypy --strict
        run: uv run --locked mypy --strict src tests
      - name: import-linter
        run: uv run --locked lint-imports
      - name: pytest (Hypothesis ci profile, 100% line and branch coverage)
        run: uv run --locked pytest -q --hypothesis-profile=ci -n auto --dist worksteal --durations=15
      - name: SPEC-001 to SPEC-006 independent cross-checks
        run: |
          for d in specs/vectors/spec-*/; do
            python3 -I "${d}crosscheck.py" "${d}vectors.json"
          done
